<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcam 同期</title>
<style>
:root {
  --bg: #15171a; --panel: #1d2024; --panel2: #24282d; --line: #33383f;
  --text: #e4e6e9; --dim: #8b929b; --accent: #5aa9ff; --accent2: #ffb45a;
  --ok: #6fd08c; --warn: #ff7a6b; --clip: #2c3e55; --clipSel: #34557d;
  --wave: #9fc6f2; --overlap: rgba(111, 208, 140, .10); --outside: rgba(0, 0, 0, .45);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.45 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
body { display: flex; flex-direction: column; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px;
  padding: 3px 8px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: #0b1420; border-color: var(--accent); }
button.big { padding: 6px 14px; font-weight: 600; }
input[type=number], input[type=text] { background: var(--bg); border: 1px solid var(--line);
  border-radius: 4px; padding: 2px 5px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

#videos { flex: 0 0 auto; display: grid; gap: 6px; padding: 8px; background: #000;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-height: 46vh; overflow: auto; }
.vtile { position: relative; background: #0a0a0a; border: 2px solid transparent; border-radius: 4px;
  aspect-ratio: 16/9; overflow: hidden; cursor: pointer; }
.vtile.sel { border-color: var(--accent); }
.vtile video { width: 100%; height: 100%; object-fit: contain; display: block; }
.vtile .lbl { position: absolute; left: 6px; top: 4px; font-size: 12px; text-shadow: 0 0 3px #000;
  background: rgba(0,0,0,.5); padding: 0 5px; border-radius: 3px; }
.vtile .off { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--dim); background: #0a0a0a; }

#transport { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 6px 10px; background: var(--panel); border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line); }
#time { font-size: 18px; min-width: 9.5em; }
.sep { width: 1px; height: 20px; background: var(--line); }
#ovinfo { color: var(--dim); }
#ovinfo b { color: var(--ok); font-weight: 600; }
#ovinfo.bad b { color: var(--warn); }
.spacer { flex: 1; }

#tl { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; position: relative; }
.row { display: flex; border-bottom: 1px solid var(--line); }
.ctl { flex: 0 0 340px; padding: 5px 8px; background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 4px; }
.row.sel .ctl { background: #1f2a38; }
.ctl .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl .name small { color: var(--dim); font-weight: 400; margin-left: 4px; }
.ctl .line { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.ctl .line button { padding: 1px 5px; font-size: 11px; }
.ctl input.offset { width: 8.5em; }
.ctl input[type=range] { width: 70px; }
.canvasWrap { flex: 1 1 auto; position: relative; min-width: 0; }
canvas { display: block; width: 100%; }
.ctl { overflow: hidden; }
#rulerRow .ctl { justify-content: center; color: var(--dim); font-size: 12px; }
#rulerRow { position: sticky; top: 0; z-index: 2; background: var(--panel); }

#help { flex: 0 0 auto; padding: 4px 10px; color: var(--dim); font-size: 11.5px;
  background: var(--panel); border-top: 1px solid var(--line); }
#help kbd { font-family: inherit; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 3px; padding: 0 4px; color: var(--text); }

#exportDlg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
  align-items: center; justify-content: center; z-index: 10; padding: 16px; }
#exportDlg.show { display: flex; }
#exportDlg .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  width: min(820px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
#exportDlg header { padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
#exportDlg .body { padding: 10px 14px; overflow: auto; }
#exportDlg pre { background: var(--bg); padding: 8px; border-radius: 5px; white-space: pre-wrap;
  font-size: 12px; margin: 6px 0 0; }
#exportDlg footer { padding: 10px 14px; border-top: 1px solid var(--line); display: flex; gap: 8px;
  justify-content: flex-end; }
.status { color: var(--accent2); font-size: 11px; }
</style>
</head>
<body>
<div id="videos"></div>

<div id="transport">
  <button id="play" class="big" title="Space">▶ 再生</button>
  <button id="loop" title="L: 再生ヘッド前後 1 秒をループ">⟲ ループ</button>
  <span id="time" class="mono">0:00:00.000</span>
  <div class="sep"></div>
  <button id="fit" title="Z">全体表示</button>
  <button id="fitOv" title="X">重なりを表示</button>
  <button id="alignMk" title="A: 選択トラックのマーカーに全マーカーを揃える">マーカーで揃える</button>
  <div class="sep"></div>
  <span id="ovinfo"></span>
  <span class="spacer"></span>
  <button id="exportBtn" class="big">書き出し…</button>
</div>

<div id="tl">
  <div class="row" id="rulerRow"><div class="ctl">タイムライン（秒）</div>
    <div class="canvasWrap"><canvas id="ruler" height="26"></canvas></div></div>
  <div id="rows"></div>
</div>

<div id="help">
  <kbd>Space</kbd> 再生/停止　<kbd>←</kbd><kbd>→</kbd> 1 フレーム（<kbd>Shift</kbd> 1 秒）
  選択トラックを <kbd>,</kbd><kbd>.</kbd> ±1 ms　<kbd>&lt;</kbd><kbd>&gt;</kbd> ±10 ms　<kbd>[</kbd><kbd>]</kbd> ±1 フレーム
  <kbd>M</kbd> 再生ヘッドにマーカー　<kbd>A</kbd> マーカーで揃える　<kbd>L</kbd> ループ
  <kbd>Ctrl+Z</kbd>/<kbd>Ctrl+Shift+Z</kbd> 取り消し/やり直し
  波形をドラッグで移動（<kbd>Shift</kbd> 微調整）、クリックで再生ヘッド、<kbd>Alt</kbd>+クリック／ダブルクリックでマーカー、ホイールでズーム（<kbd>Shift</kbd> 横スクロール）
</div>

<div id="exportDlg"><div class="box">
  <header>書き出し</header>
  <div class="body" id="exportBody"></div>
  <footer><button id="exportClose">閉じる</button><button id="exportGo" class="big on">書き出す</button></footer>
</div></div>

<script>
"use strict";
// ---------------------------------------------------------------- state
let S = null;                 // サーバのスナップショット
let tracks = [];              // クライアント側トラック
let sel = 0;
let playhead = 0;             // タイムライン秒
let view = { start: -1, pps: 50 };
let looping = false;
const ROW_H = 96;
const undo = [], redo = [];

const $ = (id) => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function fmtTime(t) {
  const sgn = t < 0 ? "-" : "";
  t = Math.abs(t);
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t - h * 3600 - m * 60;
  return `${sgn}${h}:${String(m).padStart(2, "0")}:${s.toFixed(3).padStart(6, "0")}`;
}
const refFps = () => (tracks.find(t => t.video && t.video.fps) || { video: { fps: 30 } }).video.fps;

// ---------------------------------------------------------------- audio engine
const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
const master = ctx.createGain(); master.connect(ctx.destination);

const player = {
  playing: false, gen: 0, ctx0: 0, tl0: 0, sources: [],
  now() { return this.playing ? this.tl0 + (ctx.currentTime - this.ctx0) : playhead; },
  async start(T) {
    await ctx.resume();
    this.stopSources();
    this.gen++;
    this.playing = true;
    this.tl0 = T;
    this.ctx0 = ctx.currentTime + 0.15;
    const gen = this.gen;
    tracks.forEach((t, i) => { if (t.audio) this.feed(i, gen); });
    for (const t of tracks) if (t.el) t.el.playbackRate = 1;
    updatePlayBtn();
  },
  stop() {
    if (!this.playing) return;
    playhead = this.now();
    this.playing = false; this.gen++;
    this.stopSources();
    for (const t of tracks) if (t.el) { t.el.pause(); t.el.playbackRate = 1; }
    updatePlayBtn();
  },
  restart() { if (this.playing) this.start(this.now()); },
  stopSources() { for (const s of this.sources) { try { s.stop(); } catch (e) {} } this.sources = []; },
  async feed(i, gen) {
    const t = tracks[i];
    const sr = ctx.sampleRate;
    const fileEnd = t.audio.start + t.audio.dur;
    let fileT = this.tl0 - t.offset;                       // 再生開始時点のファイル時刻
    let s0 = Math.max(0, Math.round(fileT * sr));
    let first = true;
    while (gen === this.gen && s0 / sr < fileEnd) {
      const when = this.ctx0 + (s0 / sr + t.offset - this.tl0);
      const lead = when - ctx.currentTime;
      if (lead > 3) { await new Promise(r => setTimeout(r, (lead - 3) * 1000)); continue; }
      const n = Math.round((first ? 1 : 5) * sr);
      first = false;
      let buf;
      try {
        const r = await fetch(`/pcm?i=${i}&s=${(s0 / sr).toFixed(6)}&n=${n}&sr=${sr}`);
        buf = new Float32Array(await r.arrayBuffer());
      } catch (e) { return; }
      if (gen !== this.gen) return;
      const ab = ctx.createBuffer(2, n, sr);
      const L = ab.getChannelData(0), R = ab.getChannelData(1);
      for (let k = 0; k < n; k++) { L[k] = buf[2 * k]; R[k] = buf[2 * k + 1]; }
      const src = ctx.createBufferSource();
      src.buffer = ab;
      src.connect(t.gainNode);
      const now = ctx.currentTime;
      if (when >= now) src.start(when);
      else if (now - when < n / sr) src.start(now, now - when);
      this.sources.push(src);
      src.onended = () => { const k = this.sources.indexOf(src); if (k >= 0) this.sources.splice(k, 1); };
      s0 += n;
    }
  },
};

function applyGains() {
  for (const t of tracks) if (t.gainNode) t.gainNode.gain.setTargetAtTime(t.mute ? 0 : t.gain, ctx.currentTime, 0.01);
}

// ---------------------------------------------------------------- server sync
let saveTimer = null;
const dirty = new Set();
function markDirty(i) {
  dirty.add(i);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 300);
}
async function save() {
  const patch = {};
  for (const i of dirty) {
    const t = tracks[i];
    patch[i] = { offset: t.offset, marker: t.marker, gain: t.gain, mute: t.mute };
  }
  dirty.clear();
  const r = await fetch("/api/update", { method: "POST", body: JSON.stringify({ tracks: patch }) });
  S = await r.json();
}

function snapshotOffsets() { return tracks.map(t => [t.offset, t.marker]); }
function pushUndo() { undo.push(snapshotOffsets()); if (undo.length > 200) undo.shift(); redo.length = 0; }
function restore(snap) {
  snap.forEach(([o, m], i) => { tracks[i].offset = o; tracks[i].marker = m; markDirty(i); });
  changed(true);
}

// トラック位置を変えたら呼ぶ
function changed(restartAudio) {
  for (const t of tracks) if (t.offInput && document.activeElement !== t.offInput) t.offInput.value = t.offset.toFixed(4);
  if (restartAudio) player.restart();
  updateOverlap();
  drawAll();
}

function setOffset(i, v, record = true) {
  if (record) pushUndo();
  tracks[i].offset = Math.round(v * 1e6) / 1e6;
  markDirty(i);
  changed(true);
}
function nudge(i, d) { setOffset(i, tracks[i].offset + d); }

function overlap() {
  const t0 = Math.max(...tracks.map(t => t.offset + t.span[0]));
  const t1 = Math.min(...tracks.map(t => t.offset + t.span[1]));
  return t1 > t0 ? [t0, t1] : null;
}
function updateOverlap() {
  const ov = overlap(), el = $("ovinfo");
  if (ov) { el.className = ""; el.innerHTML = `重なり <b class="mono">${fmtTime(ov[0])} 〜 ${fmtTime(ov[1])}</b>（${(ov[1] - ov[0]).toFixed(3)} 秒）`; }
  else { el.className = "bad"; el.innerHTML = `<b>全トラックが重なる区間がありません</b>`; }
}

// ---------------------------------------------------------------- peaks
function buildMips(raw) {
  // raw: Uint8Array [min,max,min,max,...]（0..255, 128 が 0）
  const mips = [raw];
  let cur = raw;
  while (cur.length > 4) {
    const n = Math.ceil(cur.length / 4);   // ペア数 / 2
    const nx = new Uint8Array(n * 2);
    for (let k = 0; k < n; k++) {
      const a = 4 * k, b = a + 2;
      nx[2 * k] = b < cur.length ? Math.min(cur[a], cur[b]) : cur[a];
      nx[2 * k + 1] = b < cur.length ? Math.max(cur[a + 1], cur[b + 1]) : cur[a + 1];
    }
    mips.push(nx); cur = nx;
  }
  let peak = 1;
  for (let k = 0; k < raw.length; k++) peak = Math.max(peak, Math.abs(raw[k] - 128));
  return { mips, norm: 127 / peak };
}

async function loadPeaks(i) {
  const t = tracks[i];
  if (t.wave || t.peaksLoading) return;
  t.peaksLoading = true;
  const r = await fetch(`/peaks?i=${i}`);
  t.peaksLoading = false;
  if (!r.ok) return;
  t.wave = buildMips(new Uint8Array(await r.arrayBuffer()));
  drawRow(i);
}

// ---------------------------------------------------------------- drawing
const css = getComputedStyle(document.documentElement);
const C = (n) => css.getPropertyValue(n).trim();
const tToX = (T) => (T - view.start) * view.pps;
const xToT = (x) => view.start + x / view.pps;

function sizeCanvas(cv, h) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.height = h + "px";
  }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [g, w, h];
}

function niceStep(pps) {
  const target = 90 / pps;
  const steps = [0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1800, 3600];
  return steps.find(s => s >= target) || 3600;
}

function drawRuler() {
  const [g, w, h] = sizeCanvas($("ruler"), 26);
  g.fillStyle = C("--panel"); g.fillRect(0, 0, w, h);
  const ov = overlap();
  if (ov) { g.fillStyle = "rgba(111,208,140,.35)"; g.fillRect(tToX(ov[0]), h - 5, tToX(ov[1]) - tToX(ov[0]), 5); }
  const step = niceStep(view.pps);
  const t0 = Math.floor(view.start / step) * step;
  g.fillStyle = C("--dim"); g.strokeStyle = C("--line"); g.font = "11px ui-monospace, monospace";
  for (let T = t0; T < xToT(w); T += step) {
    const x = Math.round(tToX(T)) + .5;
    g.beginPath(); g.moveTo(x, h - 9); g.lineTo(x, h); g.stroke();
    const dec = step < 0.01 ? 3 : step < 0.1 ? 2 : step < 1 ? 1 : 0;
    const label = Math.abs(T) >= 60 ? fmtTime(T).replace(/^0:/, "").replace(/\.?0+$/, "") : T.toFixed(dec);
    g.fillText(label, x + 3, 12);
  }
  drawPlayhead(g, h);
}

function drawPlayhead(g, h) {
  const x = Math.round(tToX(player.now())) + .5;
  g.strokeStyle = C("--accent2"); g.lineWidth = 1;
  g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
}

function drawRow(i) {
  const t = tracks[i];
  const [g, w, h] = sizeCanvas(t.cv, ROW_H);
  g.fillStyle = C("--bg"); g.fillRect(0, 0, w, h);
  const a = t.offset + t.span[0], b = t.offset + t.span[1];
  const xa = tToX(a), xb = tToX(b);
  g.fillStyle = i === sel ? C("--clipSel") : C("--clip");
  g.fillRect(xa, 4, xb - xa, h - 8);

  // 波形
  if (t.wave) {
    const pps = S.peaks_per_sec;
    const spp = pps / view.pps;           // 1px あたりのピーク数
    let lvl = 0;
    while (lvl + 1 < t.wave.mips.length && (1 << (2 * (lvl + 1))) <= spp) lvl++;
    const arr = t.wave.mips[lvl], per = 1 << (2 * lvl), n = arr.length / 2;
    const mid = h / 2, amp = (h / 2 - 6) * t.wave.norm / 128;
    g.fillStyle = C("--wave");
    const x0 = Math.max(0, Math.floor(xa)), x1 = Math.min(w, Math.ceil(xb));
    for (let x = x0; x < x1; x++) {
      // ファイル時刻 → ピーク index（ピーク 0 はファイル時刻 0 から始まる）
      const f0 = (xToT(x) - t.offset) * pps / per, f1 = (xToT(x + 1) - t.offset) * pps / per;
      let k0 = Math.floor(f0), k1 = Math.max(k0 + 1, Math.floor(f1));
      if (k1 <= 0 || k0 >= n) continue;
      k0 = Math.max(0, k0); k1 = Math.min(n, k1);
      let mn = 255, mx = 0;
      for (let k = k0; k < k1; k++) { if (arr[2 * k] < mn) mn = arr[2 * k]; if (arr[2 * k + 1] > mx) mx = arr[2 * k + 1]; }
      const y0 = mid - (mx - 128) * amp, y1 = mid - (mn - 128) * amp;
      g.fillRect(x, y0, 1, Math.max(1, y1 - y0));
    }
  } else {
    g.fillStyle = C("--dim"); g.font = "12px system-ui";
    const msg = t.audio ? (t.peaksState && t.peaksState.startsWith("error") ? "波形の作成に失敗" : "波形を作成中…") : "音声なし（映像で合わせてください）";
    g.fillText(msg, Math.max(6, xa + 6), h / 2 + 4);
  }

  // 重なり範囲の外を暗く
  const ov = overlap();
  g.fillStyle = C("--outside");
  if (ov) { g.fillRect(0, 0, tToX(ov[0]), h); g.fillRect(tToX(ov[1]), 0, w, h); }
  else g.fillRect(0, 0, w, h);

  // マーカー
  if (t.marker != null) {
    const x = Math.round(tToX(t.offset + t.marker)) + .5;
    g.strokeStyle = C("--warn"); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke();
    g.fillStyle = C("--warn"); g.beginPath(); g.moveTo(x - 5, 0); g.lineTo(x + 5, 0); g.lineTo(x, 7); g.fill();
  }
  // 開始位置（ファイル時刻 0）のラベル
  g.fillStyle = C("--dim"); g.font = "10.5px ui-monospace, monospace";
  if (xa > -200 && xa < w) g.fillText(fmtTime(a), Math.max(2, xa + 3), 13);
  drawPlayhead(g, h);
}

function drawAll() { drawRuler(); tracks.forEach((_, i) => drawRow(i)); }

// ---------------------------------------------------------------- video slaving
function syncVideos() {
  const T = player.now();
  for (const t of tracks) {
    if (!t.el || !t.el.src) continue;
    const want = T - t.offset;
    const inside = want >= t.span[0] - 0.001 && want <= t.span[1];
    t.offEl.style.display = inside ? "none" : "flex";
    if (!inside) { if (!t.el.paused) t.el.pause(); continue; }
    if (t.el.readyState < 1) continue;
    if (player.playing) {
      const diff = t.el.currentTime - want;
      if (Math.abs(diff) > 0.12 || t.el.paused) {
        t.el.currentTime = want;
        if (t.el.paused) t.el.play().catch(() => {});
      } else {
        t.el.playbackRate = clamp(1 - diff * 2, 0.9, 1.1);
      }
    } else {
      if (!t.el.paused) t.el.pause();
      if (!t.el.seeking && Math.abs(t.el.currentTime - want) > 0.0005) t.el.currentTime = want;
    }
  }
}

let lastDraw = 0;
function tick(ts) {
  if (player.playing) {
    const T = player.now();
    if (looping && T > loopRange[1]) player.start(loopRange[0]);
    // 再生ヘッドが画面外に出たら追う
    const cw = $("ruler").clientWidth;
    if (tToX(T) > cw * 0.92) { view.start = T - (cw * 0.1) / view.pps; }
    if (ts - lastDraw > 33) { drawAll(); lastDraw = ts; }
  }
  $("time").textContent = fmtTime(player.now());
  syncVideos();
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- transport
let loopRange = [0, 0];
function togglePlay() { if (player.playing) player.stop(); else { if (looping) setLoopAround(playhead); player.start(looping ? loopRange[0] : playhead); } drawAll(); }
function updatePlayBtn() { $("play").textContent = player.playing ? "■ 停止" : "▶ 再生"; $("play").classList.toggle("on", player.playing); }
function setLoopAround(T) { loopRange = [T - 1, T + 1]; }
function seek(T) {
  playhead = T;
  if (player.playing) player.start(looping ? (setLoopAround(T), loopRange[0]) : T);
  drawAll();
}

function fitAll() {
  const a = Math.min(...tracks.map(t => t.offset + t.span[0]));
  const b = Math.max(...tracks.map(t => t.offset + t.span[1]));
  const w = $("ruler").clientWidth;
  view.pps = (w - 20) / Math.max(1e-3, b - a);
  view.start = a - 10 / view.pps;
  drawAll();
}
function fitOverlap() {
  const ov = overlap(); if (!ov) return fitAll();
  const w = $("ruler").clientWidth;
  view.pps = (w - 20) / Math.max(1e-3, ov[1] - ov[0]);
  view.start = ov[0] - 10 / view.pps;
  drawAll();
}

function alignMarkers() {
  const ref = tracks[sel];
  if (ref.marker == null) { alert("選択中のトラックにマーカーがありません（M キー または Alt+クリック）"); return; }
  const T = ref.offset + ref.marker;
  pushUndo();
  tracks.forEach((t, i) => { if (i !== sel && t.marker != null) { t.offset = Math.round((T - t.marker) * 1e6) / 1e6; markDirty(i); } });
  changed(true);
}

function setMarker(i, fileT) {
  pushUndo();
  tracks[i].marker = Math.round(fileT * 1e6) / 1e6;
  markDirty(i);
  drawRow(i);
}

function select(i) {
  sel = i;
  tracks.forEach((t, k) => { t.row.classList.toggle("sel", k === i); if (t.tile) t.tile.classList.toggle("sel", k === i); });
  drawAll();
}

// ---------------------------------------------------------------- build UI
function buildTrack(t, i) {
  t.gainNode = ctx.createGain(); t.gainNode.connect(master);
  const row = document.createElement("div");
  row.className = "row";
  const kindLabel = t.kind === "video"
    ? `動画 ${t.video.w}×${t.video.h} ${t.video.fps ? t.video.fps.toFixed(3).replace(/\.?0+$/, "") + "fps" : ""}${t.audio ? " + 音声" : ""}`
    : `音声 ${t.audio.codec} ${t.audio.sr / 1000}kHz`;
  row.innerHTML = `
    <div class="ctl">
      <div class="name" title="${t.name}">${i + 1}. ${t.name}<small>${kindLabel}</small></div>
      <div class="line">位置 <input class="offset mono" type="number" step="0.001"> 秒
        <span class="status"></span></div>
      <div class="line">
        <button data-d="-0.1">−100</button><button data-d="-0.01">−10</button><button data-d="-0.001">−1</button>
        <button data-d="0.001">+1</button><button data-d="0.01">+10</button><button data-d="0.1">+100</button>
        <span style="color:var(--dim)">ms</span>
        <button data-f="-1">−1F</button><button data-f="1">+1F</button>
      </div>
      <div class="line">
        <button class="mute">M 消音</button><button class="solo">S ソロ</button>
        <input class="gain" type="range" min="0" max="2" step="0.01">
      </div>
    </div>
    <div class="canvasWrap"><canvas></canvas></div>`;
  $("rows").appendChild(row);
  t.row = row;
  t.cv = row.querySelector("canvas");
  t.offInput = row.querySelector(".offset");
  t.statusEl = row.querySelector(".status");
  t.offInput.value = t.offset.toFixed(4);
  t.offInput.addEventListener("change", () => { const v = parseFloat(t.offInput.value); if (isFinite(v)) setOffset(i, v); });
  row.querySelectorAll("button[data-d]").forEach(b => b.onclick = () => nudge(i, parseFloat(b.dataset.d)));
  row.querySelectorAll("button[data-f]").forEach(b => b.onclick = () => nudge(i, parseFloat(b.dataset.f) / refFps()));
  const muteB = row.querySelector(".mute"), soloB = row.querySelector(".solo"), gainR = row.querySelector(".gain");
  muteB.classList.toggle("on", t.mute);
  gainR.value = t.gain;
  if (!t.audio) { muteB.disabled = soloB.disabled = gainR.disabled = true; }
  muteB.onclick = () => { t.mute = !t.mute; muteB.classList.toggle("on", t.mute); applyGains(); markDirty(i); };
  soloB.onclick = () => {
    const on = !soloB.classList.contains("on");
    tracks.forEach((u, k) => { if (!u.audio) return; u.mute = on ? k !== i : false; u.row.querySelector(".mute").classList.toggle("on", u.mute); u.row.querySelector(".solo").classList.toggle("on", on && k === i); markDirty(k); });
    applyGains();
  };
  gainR.oninput = () => { t.gain = parseFloat(gainR.value); applyGains(); markDirty(i); };
  row.querySelector(".ctl").addEventListener("mousedown", () => select(i));
  attachCanvas(t, i);

  if (t.video) {
    const tile = document.createElement("div");
    tile.className = "vtile";
    tile.innerHTML = `<video muted playsinline preload="auto"></video><div class="off">範囲外</div><div class="lbl">${i + 1}. ${t.name}</div>`;
    $("videos").appendChild(tile);
    t.tile = tile; t.el = tile.querySelector("video"); t.offEl = tile.querySelector(".off");
    tile.onclick = () => select(i);
  }
}

function attachCanvas(t, i) {
  const cv = t.cv;
  cv.addEventListener("dblclick", (e) => { setMarker(i, xToT(e.offsetX) - t.offset); });
  cv.addEventListener("mousedown", (e) => {
    select(i);
    if (e.altKey) { setMarker(i, xToT(e.offsetX) - t.offset); return; }
    const x0 = e.clientX, o0 = t.offset;
    let moved = false, recorded = false;
    const mv = (ev) => {
      const dx = ev.clientX - x0;
      if (!moved && Math.abs(dx) < 3) return;
      moved = true;
      if (!recorded) { pushUndo(); recorded = true; }
      const k = ev.shiftKey ? 0.1 : 1;
      t.offset = Math.round((o0 + dx * k / view.pps) * 1e6) / 1e6;
      markDirty(i);
      changed(false);
    };
    const up = (ev) => {
      window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up);
      if (moved) player.restart(); else seek(xToT(ev.clientX - cv.getBoundingClientRect().left));
    };
    window.addEventListener("mousemove", mv); window.addEventListener("mouseup", up);
  });
}

function wheel(e) {
  if (!e.target.closest(".canvasWrap")) return;
  e.preventDefault();
  const rect = e.target.closest(".canvasWrap").getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    view.start += (e.deltaX || e.deltaY) / view.pps;
  } else {
    const T = xToT(x);
    view.pps = clamp(view.pps * Math.exp(-e.deltaY * 0.0015), 0.005, 200000);
    view.start = T - x / view.pps;
  }
  drawAll();
}

function rulerDrag() {
  const cv = $("ruler");
  cv.addEventListener("mousedown", (e) => {
    const rect = cv.getBoundingClientRect();
    seek(xToT(e.clientX - rect.left));
    const mv = (ev) => { playhead = xToT(ev.clientX - rect.left); if (!player.playing) drawAll(); };
    const up = (ev) => { window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); seek(xToT(ev.clientX - rect.left)); };
    window.addEventListener("mousemove", mv); window.addEventListener("mouseup", up);
  });
}

function keys(e) {
  if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
  const fr = 1 / refFps();
  const k = e.key;
  if ((e.ctrlKey || e.metaKey) && k.toLowerCase() === "z") {
    e.preventDefault();
    if (e.shiftKey) { if (redo.length) { undo.push(snapshotOffsets()); restore(redo.pop()); } }
    else if (undo.length) { redo.push(snapshotOffsets()); restore(undo.pop()); }
    return;
  }
  if (e.ctrlKey || e.metaKey) return;
  const map = {
    " ": () => togglePlay(),
    "ArrowLeft": () => seek(player.now() - (e.shiftKey ? 1 : fr)),
    "ArrowRight": () => seek(player.now() + (e.shiftKey ? 1 : fr)),
    ",": () => nudge(sel, -0.001), ".": () => nudge(sel, 0.001),
    "<": () => nudge(sel, -0.01), ">": () => nudge(sel, 0.01),
    "[": () => nudge(sel, -fr), "]": () => nudge(sel, fr),
    "m": () => setMarker(sel, player.now() - tracks[sel].offset),
    "a": () => alignMarkers(),
    "l": () => toggleLoop(),
    "z": () => fitAll(), "x": () => fitOverlap(),
    "ArrowUp": () => select((sel + tracks.length - 1) % tracks.length),
    "ArrowDown": () => select((sel + 1) % tracks.length),
  };
  const f = map[k] || map[k.toLowerCase()];
  if (f) { e.preventDefault(); f(); }
}

function toggleLoop() {
  looping = !looping;
  $("loop").classList.toggle("on", looping);
  if (looping) { setLoopAround(player.now()); if (player.playing) player.start(loopRange[0]); }
}

// ---------------------------------------------------------------- export dialog
function openExport() {
  const ov = overlap();
  const body = $("exportBody");
  if (!ov) { body.innerHTML = `<p>全トラックが重なる区間がありません。</p>`; $("exportGo").disabled = true; }
  else {
    $("exportGo").disabled = false;
    const rows = tracks.map(t => `<tr><td>${t.name}</td><td class="mono" style="text-align:right">${(ov[0] - t.offset).toFixed(6)}</td><td>${t.kind === "video" ? "-c:v copy -an" : "-c:a copy"}</td></tr>`).join("");
    body.innerHTML = `
      <p>タイムライン <b class="mono">${fmtTime(ov[0])} 〜 ${fmtTime(ov[1])}</b>（${(ov[1] - ov[0]).toFixed(3)} 秒）を切り出します。<br>
      出力先: <span class="mono">${S.out_dir}</span></p>
      <table style="border-collapse:collapse;width:100%"><tr style="color:var(--dim)"><td>ファイル</td><td style="text-align:right">開始（ファイル内秒）</td><td>方式</td></tr>${rows}</table>
      <pre id="exportLog">${(S.export_log || []).join("\n")}</pre>`;
  }
  $("exportDlg").classList.add("show");
}
async function doExport() {
  if (dirty.size) { clearTimeout(saveTimer); await save(); }
  const r = await fetch("/api/export", { method: "POST", body: "{}" });
  const j = await r.json();
  if (j.error) { alert(j.error); return; }
  $("exportGo").disabled = true;
  const poll = async () => {
    const s = await (await fetch("/api/state")).json();
    S = s;
    const el = $("exportLog"); if (el) el.textContent = s.export_log.join("\n");
    if (s.exporting) setTimeout(poll, 500); else $("exportGo").disabled = false;
  };
  poll();
}

// ---------------------------------------------------------------- status polling (波形/プロキシ準備)
async function pollPrep() {
  S = await (await fetch("/api/state")).json();
  let pending = false;
  S.tracks.forEach((st, i) => {
    const t = tracks[i];
    t.peaksState = st.peaks;
    if (st.peaks === "ready") loadPeaks(i);
    if (st.peaks === "pending" || st.proxy === "pending") pending = true;
    if (t.el && st.proxy === "ready" && !t.el.src) { t.el.src = `/video?i=${i}`; t.el.load(); }
    const msgs = [];
    if (st.peaks === "pending") msgs.push("波形作成中");
    if (st.proxy === "pending") msgs.push("プレビュー作成中");
    if (st.proxy && st.proxy.startsWith("error")) msgs.push("プレビュー失敗");
    t.statusEl.textContent = msgs.join(" / ");
    if (t.offEl && st.proxy === "pending") t.offEl.textContent = "プレビュー作成中…";
    else if (t.offEl) t.offEl.textContent = "範囲外";
  });
  drawAll();
  if (pending) setTimeout(pollPrep, 1000);
}

// ---------------------------------------------------------------- init
(async function init() {
  S = await (await fetch("/api/state")).json();
  tracks = S.tracks.map(t => ({ ...t, peaks: undefined, proxy: undefined }));
  tracks.forEach(buildTrack);
  applyGains();
  select(0);
  $("play").onclick = togglePlay;
  $("loop").onclick = toggleLoop;
  $("fit").onclick = fitAll;
  $("fitOv").onclick = fitOverlap;
  $("alignMk").onclick = alignMarkers;
  $("exportBtn").onclick = openExport;
  $("exportClose").onclick = () => $("exportDlg").classList.remove("show");
  $("exportGo").onclick = doExport;
  $("tl").addEventListener("wheel", wheel, { passive: false });
  window.addEventListener("keydown", keys);
  // ボタンにフォーカスが残ると Space で再度押されてしまうので外す
  document.addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) b.blur(); });
  window.addEventListener("resize", drawAll);
  rulerDrag();
  updateOverlap();
  fitAll();
  pollPrep();
  requestAnimationFrame(tick);
})();
</script>
</body>
